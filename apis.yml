- aid: uploadcare:uploadcare-file-metadata-api
  name: Uploadcare File metadata API
  description: >-
    File metadata is additional, arbitrary data, associated with uploaded file. As an example, you could
    store unique file identifier from your system.


    Metadata is key-value data. You can specify up to 50 keys, with key names up to 64 characters long
    and values up to 512 characters long.

    Read more in the [docs](https://uploadcare.com/docs/file-metadata/).


    **Notice:** Do not store any sensitive information (bank account numbers, card details, etc.) as metadata.


    **Notice:** File metadata is provided by the end-users uploading the files and can contain symbols
    unsafe in, for example, HTML context. Please escape the metadata before use according to the rules
    of the target runtime context (HTML browser, SQL query parameter, etc).
  humanURL: https://uploadcare.com/api-refs/rest-api/v0.7.0/
